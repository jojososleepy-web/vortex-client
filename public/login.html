<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Vortex Client</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:2rem">
  <div style="width:100%;max-width:450px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:3rem">
    <div style="text-align:center;margin-bottom:2rem">
      <h1 style="font-size:2rem;margin-bottom:0.5rem">⚡ Vortex Client</h1>
      <p style="color:var(--text-secondary)">Login or create account</p>
    </div>

    <div id="error-msg" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:1rem;margin-bottom:1rem;color:#ef4444"></div>

    <div style="margin-bottom:2rem">
      <button id="toggle-mode" class="btn btn-ghost btn-full" style="margin-bottom:1rem">
        Need an account? Sign up
      </button>
    </div>

    <form id="auth-form">
      <div style="margin-bottom:1rem">
        <label style="display:block;margin-bottom:0.5rem;font-weight:500">Username</label>
        <input type="text" id="username" required style="width:100%;padding:0.75rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem">
      </div>
      
      <div style="margin-bottom:1.5rem">
        <label style="display:block;margin-bottom:0.5rem;font-weight:500">Password</label>
        <input type="password" id="password" required style="width:100%;padding:0.75rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem">
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
        Login
      </button>
    </form>

    <div style="text-align:center;margin-top:2rem;padding-top:2rem;border-top:1px solid var(--border)">
      <a href="/auth/login" class="btn btn-outline btn-full">
        <svg style="width:18px;height:18px;margin-right:8px" viewBox="0 0 21 21" fill="none">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
          <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        Login with Microsoft
      </a>
      <button id="demo-btn" class="btn btn-ghost btn-full" style="margin-top:0.5rem">
        Try Demo Mode
      </button>
    </div>
  </div>
</div>

<script>
let isRegisterMode = false;
const form = document.getElementById('auth-form');
const toggleBtn = document.getElementById('toggle-mode');
const submitBtn = document.getElementById('submit-btn');
const errorMsg = document.getElementById('error-msg');

toggleBtn.addEventListener('click', () => {
  isRegisterMode = !isRegisterMode;
  submitBtn.textContent = isRegisterMode ? 'Create Account' : 'Login';
  toggleBtn.textContent = isRegisterMode ? 'Have an account? Login' : 'Need an account? Sign up';
  errorMsg.style.display = 'none';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.style.display = 'none';
  
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  
  try {
    const endpoint = isRegisterMode ? '/auth/register' : '/auth/login-password';
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    
    const data = await res.json();
    
    if (data.success) {
      window.location.href = '/account';
    } else {
      errorMsg.textContent = data.error || 'Authentication failed';
      errorMsg.style.display = 'block';
    }
  } catch (err) {
    errorMsg.textContent = 'Error: ' + err.message;
    errorMsg.style.display = 'block';
  }
});

document.getElementById('demo-btn').addEventListener('click', async () => {
  const res = await fetch('/auth/demo-login', { method: 'POST' });
  if ((await res.json()).success) window.location.href = '/account';
});
</script>
</body>
</html>
