services:
  - type: web
    name: jojos-texture-packs
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VORTEX_DOMAIN
        value: vortexproxy.online
      - key: SESSION_SECRET
        generateValue: true
      # Set these in the Render dashboard (marked sync:false so they are not
      # committed to git):
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
